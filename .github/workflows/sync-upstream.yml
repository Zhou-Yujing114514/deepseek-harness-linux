# Keep this fork aligned with the official DeepSeek Harness repository.
#
# Upstream ships macOS and Windows desktop builds only; this repository adds first-class
# Linux packaging on top of it. Upstream moves very fast (hundreds of commits per week),
# so reconciling by hand is not realistic. This workflow does it on GitHub's own runners,
# where fetching upstream is cheap and reliable.
#
# What one run does:
#   1. Fetch the official ref and measure how far behind we are.
#   2. Merge it into a fresh sync branch.
#   3. Resolve the conflicts that are predictable in a packaging fork:
#        - paths this fork owns (Linux packaging, Linux CI, READMEs) -> keep ours
#        - everything else (upstream source, dependency and version bumps) -> take upstream
#   4. Push that branch and open a pull request summarising what came from where.
#
# Nothing is written to master automatically: a human or a follow-up review decides.

name: Sync upstream

on:
  workflow_dispatch:
    inputs:
      upstream-ref:
        description: Upstream branch or tag to sync from.
        required: false
        default: master
      open-pr:
        description: Open a pull request with the merged result.
        required: false
        type: boolean
        default: true
  schedule:
    # 02:17 UTC, daily.
    - cron: '17 2 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  # Paths this fork owns. Upstream touches some of them too (desktop packaging exists
  # upstream as well), but on conflict we keep our side: Linux packaging is the entire
  # reason this repository exists. Everything outside this list follows upstream.
  #
  # Keep the `|` block a plain list of paths: the merge script treats every line as a
  # prefix rule, so explanatory comments must live outside the block. Fork-only entries:
  #   - .github/workflows/sync-upstream.yml  fork-only; guard against add/add conflicts
  #   - .github/dependabot.yml              drops the uv updater (its local editable
  #                                         path dependency cannot be resolved by Dependabot)
  #   - the three tests below               fork-only features (self-hosted publishing,
  #                                         plugin compatibility, Wayland launcher);
  #                                         upstream owns the rest of desktop tests
  OURS_PATHS: |
    apps/desktop/scripts/
    apps/desktop/.env.linux.example
    apps/desktop/README.md
    apps/desktop/package.json
    .github/workflows/desktop-linux.yml
    .github/workflows/release-attach.yml
    .github/workflows/sync-upstream.yml
    .github/dependabot.yml
    apps/desktop/tests/upload-selfhosted.spec.ts
    apps/desktop/tests/plugin-linux-compat.spec.ts
    apps/desktop/tests/linux-launch-compat.spec.ts
    .github/actions/prepare-linux-env/
    .github/actions/smoke-linux-appimage/
    README.md
    README.zh.md

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out our repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The default GITHUB_TOKEN is not allowed to touch .github/workflows/, and a sync
          # nearly always changes upstream workflow files. SYNC_TOKEN is a PAT carrying the
          # workflow scope; fall back to the built-in token when it is absent.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Fetch the official upstream
        id: upstream
        run: |
          set -euo pipefail
          REF="${{ inputs.upstream-ref || 'master' }}"
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git 2>/dev/null || true
          git fetch upstream "${REF}:refs/remotes/upstream-sync" --no-tags --force
          SHA="$(git rev-parse refs/remotes/upstream-sync)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Fetched upstream ${REF} at ${SHA}"

      - name: Measure the gap
        id: gap
        run: |
          set -euo pipefail
          SHA="${{ steps.upstream.outputs.sha }}"
          BASE="$(git merge-base HEAD "${SHA}")"
          BEHIND="$(git rev-list --count "${BASE}..${SHA}")"
          AHEAD="$(git rev-list --count "${SHA}..HEAD")"
          echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
          echo "ahead=${AHEAD}" >> "$GITHUB_OUTPUT"
          {
            echo "### Sync summary"
            echo ""
            echo "- upstream ref: \`${{ steps.upstream.outputs.ref }}\` (\`${SHA:0:12}\`)"
            echo "- merge base: \`${BASE:0:12}\`"
            echo "- commits behind upstream: **${BEHIND}**"
            echo "- our commits on top: **${AHEAD}**"
          } > summary.md

      # When behind == 0 the steps below are all skipped by their own guards; this
      # step only prints the friendly message. (exit 0 alone would not stop them.)
      - name: Stop when already current
        if: steps.gap.outputs.behind == '0'
        run: |
          echo "Already up to date with upstream; nothing to do."

      - name: Merge upstream and resolve conflicts
        if: steps.gap.outputs.behind != '0'
        id: merge
        run: |
          set -uo pipefail
          SHA="${{ steps.upstream.outputs.sha }}"
          # Fixed name on purpose. A timestamped branch made every run open a new PR,
          # because the dedup below looks the PR up by branch name and never found one.
          # Reuse a single branch and force-push the fresh merge instead.
          BRANCH="sync/upstream"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"

          git merge --no-edit "${SHA}" >/dev/null 2>&1 || echo "merge reported conflicts"

          UNMERGED="$(git diff --name-only --diff-filter=U || true)"

          if [ -z "${UNMERGED}" ]; then
            echo "outcome=clean" >> "$GITHUB_OUTPUT"
            echo "### Conflict resolution" > resolved.md
            echo "" >> resolved.md
            echo "Merged cleanly — no conflicts." >> resolved.md
          else
            echo "outcome=conflicts" >> "$GITHUB_OUTPUT"
            {
              echo "### Conflict resolution"
              echo ""
              echo "| file | kept |"
              echo "| --- | --- |"
            } > resolved.md

            while IFS= read -r f; do
              [ -z "${f}" ] && continue
              keep=theirs
              while IFS= read -r p; do
                [ -z "${p}" ] && continue
                case "${f}" in
                  "${p}"*) keep=ours; break;;
                esac
              done <<< "${OURS_PATHS}"

              if [ "${keep}" = "ours" ]; then
                git checkout --ours -- "${f}" 2>/dev/null || true
              else
                git checkout --theirs -- "${f}" 2>/dev/null || true
              fi
              git add -- "${f}" 2>/dev/null || true
              if [ "${keep}" = "ours" ]; then
                echo "| \`${f}\` | ours — ⚠️ **upstream changes discarded, manual backfill required** |" >> resolved.md
              else
                echo "| \`${f}\` | ${keep} |" >> resolved.md
              fi
            done <<< "${UNMERGED}"

            # Anything still unresolved after the pass above (added/deleted combinations)
            # falls back to upstream so the run never leaves the tree in a conflicted state.
            STILL="$(git diff --name-only --diff-filter=U || true)"
            if [ -n "${STILL}" ]; then
              while IFS= read -r f; do
                [ -z "${f}" ] && continue
                git checkout --theirs -- "${f}" 2>/dev/null || true
                git add -- "${f}" 2>/dev/null || true
                echo "| \`${f}\` | theirs (fallback) |" >> resolved.md
              done <<< "${STILL}"
            fi

            if git diff --cached --quiet 2>/dev/null; then
              git commit --no-edit -m "Merge upstream ${SHA:0:12}" >/dev/null 2>&1 || true
            else
              git commit --no-edit >/dev/null 2>&1 || git commit -m "Merge upstream ${SHA:0:12}" >/dev/null 2>&1 || true
            fi
          fi

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          {
            cat summary.md
            echo ""
            cat resolved.md
            echo ""
            echo "> ⚠️ **Every \`ours\` row threw upstream's version of that file away.** Keeping"
            echo "> ours is deliberate — this fork's Linux packaging lives in those files — but"
            echo "> whatever upstream changed in them is absent from this branch and has to be"
            echo "> re-applied by hand. Diff each \`ours\` file against upstream \`${SHA:0:12}\`"
            echo "> before merging, or the next sync will silently re-drop it again."
          } > pr-body.md
          cat pr-body.md

      - name: Push the sync branch
        if: steps.gap.outputs.behind != '0'
        run: |
          set -euo pipefail
          # The branch is reused across runs, so this push is never a fast-forward.
          git push --force origin "${{ steps.merge.outputs.branch }}"

      - name: Open a pull request
        # `inputs.open-pr` only exists on workflow_dispatch runs. On a scheduled run it
        # is empty, and in an Actions expression comparing that empty value with
        # `false` evaluates to false -- which silently skipped this step every day:
        # the merged sync/upstream branch was pushed, but no PR ever proposed it to
        # master, so the fork drifted behind upstream while every run looked green.
        # Only an explicit manual opt-out may disable PR creation.
        if: steps.gap.outputs.behind != '0' && (github.event_name != 'workflow_dispatch' || inputs.open-pr != false)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ steps.merge.outputs.branch }}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          # Close PRs left behind by the old timestamped branch naming. With the fixed branch
          # name above, only one sync PR can be open from now on.
          LEGACY="$(gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("sync/upstream-")) | .number' || true)"
          for n in ${LEGACY}; do
            gh pr close "${n}" --comment "Superseded by the fixed \`sync/upstream\` branch." || true
          done
          # Query open PRs for this exact head via REST. `gh pr list --head <branch>` with a
          # bare branch name returns nothing under the Actions GITHUB_TOKEN integration, which
          # used to make every daily run fall through to POST and fail with 422
          # "A pull request already exists ...". The REST list endpoint with a fully-qualified
          # `owner:branch` head filter is reliable here.
          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=master&head=${OWNER}:${BRANCH}" \
            --jq '.[0].number // empty' || true)"
          if [ -n "${EXISTING}" ]; then
            echo "Pull request #${EXISTING} already exists for ${BRANCH}; nothing to do."
            exit 0
          fi
          # `gh pr create` uses the GraphQL createPullRequest mutation, which the
          # GITHUB_TOKEN integration is not allowed to call (it fails with
          # "Resource not accessible by integration (createPullRequest)" even when
          # the repo's "allow Actions to create/approve PRs" switch is on). The REST
          # endpoint is permitted with the pull-requests: write scope declared above.
          # Tolerate a race where another run created the PR in between: re-check on
          # failure and treat "already exists" as success instead of failing the sync.
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" \
            -f base=master \
            -f head="${BRANCH}" \
            -f title="chore: sync with upstream deepseek-ai/deepseek-harness (${{ steps.gap.outputs.behind }} commits)" \
            -F body=@pr-body.md \
            --jq '.html_url'; then
            exit 0
          fi
          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=master&head=${OWNER}:${BRANCH}" \
            --jq '.[0].number // empty' || true)"
          if [ -n "${EXISTING}" ]; then
            echo "Pull request #${EXISTING} already exists (created concurrently); treating as success."
            exit 0
          fi
          echo "Failed to open a pull request and none exists for ${BRANCH}." >&2
          exit 1
